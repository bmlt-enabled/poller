name: 'release'

on:
  push:
    tags: [ '*' ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v6

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Linter 🧹
        id: linter
        run: make lint

  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v6

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer

      - name: Install dependencies 📦
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress test suite 🔧
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run PHPUnit 🧪
        run: vendor/bin/phpunit --colors=always
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: wordpress_test

  package:
    runs-on: ubuntu-24.04
    needs: [ lint, test ]
    permissions:
      contents: write
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v6

      - name: Build plugin zip 📦
        run: |
          export ZIP_FILENAME=poller-${GITHUB_REF_NAME}.zip
          make build
          echo "ARTIFACT_PATH=build/${ZIP_FILENAME}" >> "$GITHUB_ENV"

      - name: Generate Release Notes 📝
        if: github.ref_type == 'tag'
        run: |
          curl -fsSL -o gh-release-notes.sh https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/main/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh readme.txt "wp"
          if [[ "$GITHUB_REF_NAME" == *beta* ]]; then
            echo "RELEASE_TYPE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=false" >> "$GITHUB_ENV"
          fi

      - name: Create Release 🎉
        uses: ncipollo/release-action@v1.20.0
        if: github.ref_type == 'tag'
        with:
          artifacts: ${{ env.ARTIFACT_PATH }}
          bodyFile: changelog.txt
          prerelease: ${{ env.RELEASE_TYPE }}
